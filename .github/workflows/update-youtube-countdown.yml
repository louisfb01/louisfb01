name: Update YouTube Countdown

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: write

concurrency:
  group: update-youtube-countdown
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate countdown badge
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: UCUzGQrN-lyyc0BWTYoJM_Sg
          YOUTUBE_SUBSCRIBER_GOAL: "100000"
        run: python scripts/update_youtube_countdown.py

      - name: Commit badge update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/youtube-countdown.svg
          if git diff --cached --quiet; then
            echo "No badge changes."
            exit 0
          fi
          git commit -m "Update YouTube countdown badge"
          git pull --rebase origin main
          git push
