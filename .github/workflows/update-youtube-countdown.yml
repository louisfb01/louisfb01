name: Update YouTube Countdown

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-youtube-countdown
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate profile stats
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: UCUzGQrN-lyyc0BWTYoJM_Sg
          YOUTUBE_CHANNEL_TITLE: "What's AI"
          YOUTUBE_SUBSCRIBER_GOAL: "100000"
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: louisfb01
        run: python scripts/update_youtube_countdown.py

      - name: Commit profile stats update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md images/github-followers.svg images/youtube.svg images/youtube-countdown.svg
          if git diff --cached --quiet; then
            echo "No badge changes."
            exit 0
          fi
          git commit -m "Update profile stats"
          git pull --rebase origin main
          git push
